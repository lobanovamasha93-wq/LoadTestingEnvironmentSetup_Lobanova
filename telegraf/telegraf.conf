# Telegraf configuration — собирает аппаратные метрики хоста и отправляет в InfluxDB.
# Основано на примере из ./samples/telegraf курса, дополнено плагинами памяти/swap/диска/сети
# и настройками для сбора метрик именно хост-машины, а не контейнера.

[global_tags]

[agent]
  ## Частота сбора метрик — по заданию: каждые 60 секунд
  interval = "60s"
  round_interval = true
  metric_buffer_limit = 10000
  flush_buffer_when_full = true
  collection_jitter = "0s"
  flush_interval = "60s"
  flush_jitter = "0s"
  debug = false
  quiet = false
  hostname = ""

###############################################################################
#                                  OUTPUTS                                    #
###############################################################################
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "influx"
  precision = "s"
  timeout = "5s"

###############################################################################
#                                  INPUTS                                     #
###############################################################################

# CPU
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  fielddrop = ["time_*"]

# Общая информация о системе (load average, uptime)
[[inputs.system]]
  # no configuration

# Ядро: контекстные переключения, прерывания
[[inputs.kernel]]
  # no configuration

# Количество процессов по статусам
[[inputs.processes]]
  # no configuration

# Оперативная память — по заданию
[[inputs.mem]]
  # no configuration

# Swap — по заданию
[[inputs.swap]]
  # no configuration

# Жёсткий диск: занятое/свободное место — по заданию
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Жёсткий диск: нагрузка на I/O (чтение/запись) — по заданию
[[inputs.diskio]]
  # no configuration

# Сеть: сетевые интерфейсы (трафик, ошибки, дропы) — по заданию
[[inputs.net]]
  # no configuration

# Сеть: статистика TCP/UDP соединений — по заданию
[[inputs.netstat]]
  # no configuration
